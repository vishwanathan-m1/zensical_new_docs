plugins:
  - search:
      lang: 
        - en
        - de
#   - literate-nav:
#       nav_file: SUMMARY.md
  # - meta
  - tags
  - meta-descriptions
  - redirects:
      redirect_maps:
        'user/faq_OOOX.md': 'user/faq_OOO.md'   
  - minify:
      minify_html: true  
      minify_js: true
      minify_css: true         
  - section-index
  - macros
  - include-markdown
  - mike:
      canonical_version: latest
      alias_type: redirect
  - git-revision-date-localized:
      type: date

extra_css:
  - assets/stylesheets/minichat.css

extra_javascript:
  - assets/javascripts/MiniChatJavaScript.js
  