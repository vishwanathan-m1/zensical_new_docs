site_name: HCL Verse Help Center
site_url: https://help.hcl-software.com/verse_onprem/3.2/index.html
# site_description: >
#   HCL Verse documentation for users and admins.
use_directory_urls: false
docs_dir: source
# site_dir: docs

# Theme Configuration
theme:
  name: material
  logo: assets/images/logo.svg 
  favicon: assets/images/favicon.png
  language: en
  features:
    - navigation.tabs
    - navigation.indexes
    - navigation.top
    - navigation.instant
#    - navigation.prune
    - search.highlight
    - search.share
    - search.suggest
    - content.code.select
    - content.code.copy
    - content.action.edit
    - content.action.view
  custom_dir: theme_overrides
  icon:
    repo: fontawesome/brands/github
    logo: fontawesome/regular/home
#    edit: fontawesome/regular/pen-to-square
    # tag:
    #   default: lucide/hash
    #   html: fontawesome/brands/html5  
  font:
    text: Roboto
    code: Roboto Mono
  
  # Static files
# static_templates:
#   - 404.html
#    - partials/footer.html

# Markdown Extensions
markdown_extensions:
  - admonition
  - pymdownx.details
  - attr_list
  - md_in_html
  - pymdownx.superfences
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
  - toc:
      title: On this page
#  - pymdownx.highlight:
#      use_pygments: true
#      pygments_lang_class: true
#      auto_title: false
#      linenums: false
#  - pymdownx.superfences:
