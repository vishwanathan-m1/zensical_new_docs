<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256" role="img" aria-label="V logo" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="left" x1="0" y1="0" x2="0.6" y2="1">
      <stop offset="0" stop-color="#b8f1ff"/>
      <stop offset="0.4" stop-color="#38b6ff"/>
      <stop offset="1" stop-color="#1a5cff"/>
    </linearGradient>
    <linearGradient id="right" x1="1" y1="0" x2="0.3" y2="1">
      <stop offset="0" stop-color="#4cc3ff"/>
      <stop offset="0.5" stop-color="#1f7dff"/>
      <stop offset="1" stop-color="#0b2fcf"/>
    </linearGradient>
    <linearGradient id="shine" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.95"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
    <radialGradient id="halo" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#2aa8ff" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#2aa8ff" stop-opacity="0"/>
    </radialGradient>
    <filter id="glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="7" result="b"/>
      <feMerge>
        <feMergeNode in="b"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- soft halo -->
  <circle cx="128" cy="132" r="120" fill="url(#halo)"/>

  <g filter="url(#glow)">
    <!-- left facet -->
    <path d="M36 48 H92 L128 152 V216 H100 Z" fill="url(#left)"/>
    <!-- right facet -->
    <path d="M220 48 H164 L128 152 V216 H156 Z" fill="url(#right)"/>
  </g>

  <!-- center ridge -->
  <path d="M128 152 V216" stroke="#d9f6ff" stroke-opacity="0.7" stroke-width="1.5"/>

  <!-- shine highlights -->
  <path d="M46 54 H86 L118 146 L110 158 Z" fill="url(#shine)" opacity="0.6"/>
  <path d="M38 49 H218" stroke="#ffffff" stroke-opacity="0.7" stroke-width="2" stroke-linecap="round"/>

  <!-- sparkle -->
  <path d="M206 20 L212 40 L232 46 L212 52 L206 72 L200 52 L180 46 L200 40 Z"
        fill="#ffffff" opacity="0.95"/>
</svg>
