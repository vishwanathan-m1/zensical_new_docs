<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b1b3f"/>
      <stop offset="1" stop-color="#050b1f"/>
    </linearGradient>
    <linearGradient id="v" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#9be7ff"/>
      <stop offset="0.45" stop-color="#2aa8ff"/>
      <stop offset="1" stop-color="#1457ff"/>
    </linearGradient>
    <linearGradient id="shine" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.9"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
    <radialGradient id="halo" cx="0.5" cy="0.55" r="0.5">
      <stop offset="0" stop-color="#2aa8ff" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#2aa8ff" stop-opacity="0"/>
    </radialGradient>
    <filter id="glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="2.2" result="b"/>
      <feMerge>
        <feMergeNode in="b"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- background tile -->
  <rect width="64" height="64" rx="14" fill="url(#bg)"/>
  <circle cx="32" cy="34" r="30" fill="url(#halo)"/>

  <!-- the V -->
  <path d="M10 14 H23 L32 40 L41 14 H54 L38 52 H26 Z"
        fill="url(#v)" filter="url(#glow)"/>

  <!-- shine highlights -->
  <path d="M13 16 H21 L30 40 L28.5 43 Z" fill="url(#shine)" opacity="0.7"/>
  <path d="M11 14.5 H53" stroke="#ffffff" stroke-opacity="0.6" stroke-width="1" stroke-linecap="round"/>

  <!-- sparkle -->
  <path d="M50 9 L51.2 12.8 L55 14 L51.2 15.2 L50 19 L48.8 15.2 L45 14 L48.8 12.8 Z"
        fill="#ffffff" opacity="0.95"/>
</svg>
